build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    - pandoc
  jobs:
    post_install:
      # The example notebooks call extract_sentiment / cluster_comments,
      # which need this model; nbsphinx re-executes every notebook on each
      # build since nbstripout keeps committed outputs empty.
      - pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - nlp
    - requirements: docs/requirements.txt
