name: Tests

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.resolution }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]
        resolution: [highest, lowest-direct]
        exclude:
          # The lowest-direct resolution pins direct deps to their floors
          # (spacy 3.1.3, tokenizers 0.14.1, thinc 8.0.17, transitive y-py 0.6.2),
          # none of which ship py3.13 wheels, so they can't build on 3.13.
          # lowest-direct is still exercised on py3.10 below.
          - python-version: "3.13"
            resolution: lowest-direct
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            resolution: highest
          - os: ubuntu-latest
            python-version: "3.10"
            resolution: lowest-direct

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (with the optional nlp extra)
      run: uv sync --group dev --extra nlp --resolution ${{ matrix.resolution }}

    # Pre-fetch model directly with uv so tests don't download at runtime
    - name: Pre-install spaCy model
      run: uv pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl
      
    - name: Run tests
      run: uv run pytest tests/ -v --tb=short

  # Verify the Likert clustering / preprocessing functionality works in a
  # torch-free core install (no 'nlp' extra). The free-text NLP tests skip
  # themselves via pytest.importorskip when spacy/transformers are absent.
  test-core:
    name: Test core-only, no nlp extra (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install core dependencies only (no nlp extra)
      run: uv sync --group dev

    - name: Assert torch / spacy are NOT installed
      run: |
        uv run python - <<'PY'
        import importlib.util as u
        for mod in ("torch", "spacy", "sentence_transformers", "transformers"):
            assert u.find_spec(mod) is None, f"{mod} should not be installed in a core-only env"
        import pandas_survey_toolkit.nlp  # must import torch-free
        print("core-only import OK")
        PY

    - name: Run tests (nlp tests skip automatically)
      run: uv run pytest tests/ -v --tb=short
